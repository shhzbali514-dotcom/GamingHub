<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Gaming Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body>

  <div id="loader" class="loader-overlay">
    <div class="loader-ring"></div>
    <span class="loader-text">LOADING HUB</span>
  </div>

  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>
  <canvas id="particlesCanvas"></canvas>

  <nav class="navbar glass-nav" id="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <span class="logo-text">GAMING<span class="hub">HUB</span></span>
      </div>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html">Home</a></li>
        <li><a href="games.html">Games</a></li>
        <li><a href="reviews.html">Reviews</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li class="nav-cta"><a href="login.html" class="btn-neon">Sign In</a></li>
      </ul>
      <div class="nav-hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </div>
    </div>
  </nav>

  <section class="section" style="padding-top:120px;min-height:80vh;display:flex;align-items:center;">
    <div class="container">
      <div class="glass-panel animate-fade-up" style="max-width:520px;margin:0 auto;text-align:left;">
        <div style="text-align:center;margin-bottom:24px;">
          <div style="font-size:3rem;margin-bottom:4px;">🚀</div>
          <h2 style="font-family:var(--font-display);font-size:1.8rem;">Join Gaming Hub</h2>
          <p style="color:var(--gray-text);">Create your account</p>
        </div>

        <form>
          <div style="text-align:center;margin-bottom:20px;">
            <div style="width:80px;height:80px;border-radius:50%;background:var(--gradient-primary);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:2.5rem;cursor:pointer;border:3px solid var(--glass-border);">
              👤
            </div>
            <p style="color:var(--gray-text);font-size:0.8rem;margin-top:4px;">Upload Avatar (click)</p>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;margin-bottom:4px;color:var(--gray-text);font-weight:600;font-size:0.9rem;">Username</label>
            <input type="text" placeholder="GamerTag" style="width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:10px;color:var(--white);font-family:var(--font-primary);" />
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;margin-bottom:4px;color:var(--gray-text);font-weight:600;font-size:0.9rem;">Email Address</label>
            <input type="email" placeholder="gamer@example.com" style="width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:10px;color:var(--white);font-family:var(--font-primary);" />
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;margin-bottom:4px;color:var(--gray-text);font-weight:600;font-size:0.9rem;">Password</label>
            <input type="password" placeholder="Create a strong password" style="width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:10px;color:var(--white);font-family:var(--font-primary);" />
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;margin-bottom:4px;color:var(--gray-text);font-weight:600;font-size:0.9rem;">Confirm Password</label>
            <input type="password" placeholder="Confirm your password" style="width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:10px;color:var(--white);font-family:var(--font-primary);" />
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
            <div>
              <label style="display:block;margin-bottom:4px;color:var(--gray-text);font-weight:600;font-size:0.9rem;">Platform</label>
              <select style="width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:10px;color:var(--white);font-family:var(--font-primary);">
                <option>PC</option>
                <option>PlayStation</option>
                <option>Xbox</option>
                <option>Nintendo</option>
              </select>
            </div>
            <div>
              <label style="display:block;margin-bottom:4px;color:var(--gray-text);font-weight:600;font-size:0.9rem;">Country</label>
              <select style="width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:10px;color:var(--white);font-family:var(--font-primary);">
                <option>United States</option>
                <option>United Kingdom</option>
                <option>Canada</option>
                <option>Germany</option>
                <option>Pakistan</option>
                <option>India</option>
              </select>
            </div>
          </div>

          <div style="margin-bottom:20px;">
            <label style="color:var(--gray-text);font-size:0.85rem;cursor:pointer;display:flex;align-items:center;gap:8px;">
              <input type="checkbox" style="accent-color:var(--neon-blue);" /> I agree to the Terms & Conditions and Privacy Policy
            </label>
          </div>

          <button type="submit" class="btn-primary" style="width:100%;">Create Account</button>
        </form>

        <div style="text-align:center;padding-top:20px;margin-top:20px;border-top:1px solid var(--glass-border);">
          <p style="color:var(--gray-text);">Already have an account? <a href="login.html" style="color:var(--neon-blue);font-weight:600;">Sign In</a></p>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer" style="padding:20px 0;">
    <div class="container">
      <div class="footer-credit" style="text-align:center;">
        <p>© 2026 Gaming Hub · crafted by <strong>Shahzaib Tahir</strong></p>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
